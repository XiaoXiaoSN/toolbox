<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>跑馬燈 · Toolbox</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/marquee.js"></script>
</head>
<body class="marquee">
  <div id="screen"><span id="message">Hello!</span></div>
  <form id="controls" class="row">
    <a href="/">Toolbox</a>
    <input id="message-input" aria-label="文字" value="Hello!" maxlength="10000">
    <label>速度 <input id="speed" type="number" min="1" max="5000" value="200" required></label>
    <button>更新</button><button id="pause" type="button">暫停／播放</button>
    <button id="fullscreen" type="button">全螢幕</button>
  </form>
</body>
</html>
