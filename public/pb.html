<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>剪貼簿 · Toolbox</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/pb.js"></script>
</head>
<body>
  <nav><a href="/">Toolbox</a><a href="/marquee">跑馬燈</a><a href="/surl">短網址</a></nav>
  <h1>共享剪貼簿</h1>
  <form id="connect" class="row" hidden>
    <input id="token" type="password" placeholder="API token（公開模式可留空）" aria-label="API token（選填）" autocomplete="off">
    <button>連線／重試</button>
  </form>
  <textarea id="text" aria-label="剪貼簿文字" spellcheck="false" disabled></textarea>
  <div class="row">
    <button id="save" disabled>儲存</button><button id="reload" disabled>重新讀取</button><button id="copy" disabled>複製</button>
    <label><input id="autosave" type="checkbox" checked>自動儲存</label>
    <span id="count">0 / 10000 bytes</span>
  </div>
  <output id="status" aria-live="polite">讀取中…</output>
  <p>同一份文字，最後完成的寫入為準。預設公開；只有啟用驗證的部署才需要 token。</p>
</body>
</html>
